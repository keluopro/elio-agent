name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Recherche sur le coffre d'exemple (sans modèle local)
        env:
          ELIO_SENS: non
          ELIO_SAVOIR_DB: /tmp/savoir.db
        run: |
          python -m elio savoir indexer
          python -m elio savoir evaluer exemple/questions.jsonl --sans-sens
